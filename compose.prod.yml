# GOSO production overlay.
# Usage: docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# Minimized vs GoClaw's 8 overlays (postgres, redis, jaeger/otel, tailscale,
# sandbox, browser, selfservice, upgrade). This file adds restart policy,
# production env, auth token, log rotation, and a SQLite backup sidecar.
# Optional local Postgres is compose profile `postgres` in compose.yml (SPEC 085),
# not this overlay — default and demo stay SQLite. Redis/jaeger/tailscale stay docs.

services:
  gateway:
    restart: unless-stopped
    volumes:
      - backup:/backup
    environment:
      GOSO_ENV: production
      GOSO_ADMIN_TOKEN: ${GOSO_ADMIN_TOKEN:-}
      GOSO_RATE_LIMIT: ${GOSO_RATE_LIMIT:-60}
      GOSO_LOG_LEVEL: ${GOSO_LOG_LEVEL:-info}
      GOSO_MASTER_KEY: ${GOSO_MASTER_KEY:-}
      GOSO_LLM_PROVIDER: ${GOSO_LLM_PROVIDER:-}
      GOSO_ROUTER9_BASE_URL: ${GOSO_ROUTER9_BASE_URL:-}
      GOSO_ROUTER9_MODEL: ${GOSO_ROUTER9_MODEL:-}
      GOSO_SSRF: ${GOSO_SSRF:-}
      GOSO_INJECTION: ${GOSO_INJECTION:-}
      GOSO_WS_ORIGINS: ${GOSO_WS_ORIGINS:-}
      GOSO_DEV_MODE: ${GOSO_DEV_MODE:-}
      GOSO_BACKUP_DIR: /backup
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  control-plane:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: alpine:3.21
    restart: unless-stopped
    volumes:
      - data:/data:ro
      - backup:/backup
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETAIN: ${BACKUP_RETAIN:-14}
      GOSO_ADMIN_TOKEN: ${GOSO_ADMIN_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - |
        echo "GOSO backup via gateway VACUUM INTO every $$BACKUP_INTERVAL_SECONDS s retain $$BACKUP_RETAIN"
        while true; do
          wget -qO- --header="Authorization: Bearer $$GOSO_ADMIN_TOKEN" --post-data='{}' http://gateway:8080/api/system/backup || echo "backup fail"
          retain=$${BACKUP_RETAIN:-14}
          case "$$retain" in
            ''|*[!0-9]*) retain=14 ;;
          esac
          if [ "$$retain" -lt 1 ]; then retain=1; fi
          ls -1t /backup/goso-*.db 2>/dev/null | tail -n +$$((retain+1)) | while read f; do rm -f "$$f"; done
          sleep $$BACKUP_INTERVAL_SECONDS
        done
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  backup:
