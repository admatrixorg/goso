name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goso
          POSTGRES_PASSWORD: goso
          POSTGRES_DB: goso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goso -d goso"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      GOSO_TEST_POSTGRES_DSN: postgres://goso:goso@localhost:5432/goso?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks
        run: |
          VER=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install semgrep
        run: |
          # setuptools 82+ dropped pkg_resources; opentelemetry in semgrep 1.110 still imports it
          python3 -m pip install --user "setuptools==70.3.0" "semgrep==1.110.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml

      - name: make verify
        run: make verify

      # SPEC 153. make verify already runs this package via go test ./...
      # This step prints the SQLite and Postgres score table. The job DSN is
      # GOSO_TEST_POSTGRES_DSN. A miss that passed at 9545d08 fails the step.
      # The checked-in floor itself does not.
      - name: memory-vi bench (sqlite + postgres)
        run: go test ./gateway/memorybench -count=1 -timeout 15m -v

      - name: desktop verify
        run: make -C desktop verify

      - name: gateway smoke
        run: make smoke
