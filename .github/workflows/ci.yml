name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: go vet
        working-directory: goso
        run: go vet ./...
      - name: gofmt
        working-directory: goso
        run: test -z "$(gofmt -l gateway)"
      - name: go test
        working-directory: goso
        run: go test ./... -count=1
      - name: gateway smoke
        working-directory: goso
        run: |
          go run ./gateway/cmd/goso-gateway version
          go run ./gateway/cmd/goso-gateway doctor
