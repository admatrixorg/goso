name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l gateway desktop)"
      - name: go test
        run: go test ./... -count=1
      - name: gateway smoke
        run: |
          go run ./gateway/cmd/goso-gateway version
          go run ./gateway/cmd/goso-gateway doctor
      - name: desktop verify
        run: make -C desktop verify
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml
      - name: mcp verify
        run: pnpm -C mcp install --frozen-lockfile && pnpm -C mcp verify
